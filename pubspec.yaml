  webview_flutter_android: ^4.10.11
  webview_flutter_wkwebview: ^3.23.5
  image_picker: ^1.2.1
  dotted_border: ^3.1.0
  chucker_flutter: ^1.9.1
  dio: ^5.9.0
  crop_your_image: ^2.0.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  socket_io_client: ^3.1.4
  firebase_core: ^4.4.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  another_flushbar: ^1.12.30
