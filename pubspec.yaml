  flutter_facebook_auth: ^7.2.0

dependency_overrides:
  google_maps_flutter_android: 2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  image: ^4.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/lottie/

  fonts:
    - family: Onest-Bold
      fonts:
        - asset: assets/fonts/Onest-Bold.ttf

    - family: Onest-ExtraBold
      fonts:
        - asset: assets/fonts/Onest-ExtraBold.ttf

    - family: Onest-Medium
      fonts:
        - asset: assets/fonts/Onest-Medium.ttf

    - family: Onest-Regular
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf

    - family: Onest-SemiBold
      fonts:
        - asset: assets/fonts/Onest-SemiBold.ttf

flutter_native_splash:
  color: "#13AC6F"
  image: "assets/images/playstore_splash.png"
  android: true
  ios: true
  android_12:
    color: "#13AC6F"
    image: "assets/images/playstore_splash.png"
 